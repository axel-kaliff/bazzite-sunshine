---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  test-scripts:
    name: Test shell scripts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck and health tests
        run: |
          find build_files system_files tests -type f \( -name '*.sh' -o -path '*/libexec/bazzite-sunshine/*' \) -print0 |
            xargs -0 shellcheck
          timeout 60 bash tests/health-check.sh

  build_push:
    name: Build and push image
    needs: test-scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push-image.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Resolve base image
        run: |
          digest=$(timeout 120 skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ublue-os/bazzite-dx-nvidia-gnome:stable)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "BASE_IMAGE=ghcr.io/ublue-os/bazzite-dx-nvidia-gnome@${digest}" >> "$GITHUB_ENV"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Container tests
        run: |
          timeout 120 podman run --rm --pull=never --cap-add=SYS_ADMIN --cap-add=SYS_NICE \
            "${IMAGE_NAME}:${DEFAULT_TAG}" bash -euo pipefail -c '
              rpm -q Sunshine
              echo "PASS: Sunshine RPM installed"
              rpm -q k3s-selinux
              echo "PASS: k3s-selinux RPM installed"
              semodule -l | grep -Eq "^k3s([[:space:]]|$)"
              echo "PASS: k3s SELinux module installed"
              getcap "$(readlink -f /usr/bin/sunshine)" | grep -w cap_sys_admin
              echo "PASS: Sunshine has cap_sys_admin"
              linked_libraries=$(ldd "$(readlink -f /usr/bin/sunshine)")
              if printf "%s\n" "$linked_libraries" | grep "not found"; then
                exit 1
              fi
              echo "PASS: all linked libraries resolve"
              if ! verification=$(rpm -V --nomtime Sunshine 2>&1); then
                printf "%s\n" "$verification"
                exit 1
              fi
              echo "PASS: Sunshine files and capabilities match the RPM"
              shopt -s nullglob
              for repo in /etc/yum.repos.d/*lizardbyte*; do
                if grep -Eq "^[[:space:]]*enabled[[:space:]]*=[[:space:]]*1([[:space:]]|$)" "$repo"; then
                  echo "FAIL: enabled COPR in $repo" >&2
                  exit 1
                fi
              done
              echo "PASS: LizardByte COPRs disabled"
              for repo in /etc/yum.repos.d/*rancher*; do
                echo "FAIL: Rancher repo remains in $repo" >&2
                exit 1
              done
              echo "PASS: Rancher repo removed"
              for unit in app-dev.lizardbyte.app.Sunshine.service sunshine-stream-watchdog.service sunshine-health.timer; do
                [[ $(systemctl --global is-enabled "$unit") == enabled ]]
                echo "PASS: $unit enabled globally"
              done
              XDG_RUNTIME_DIR=$(mktemp -d)
              export XDG_RUNTIME_DIR
              systemd-analyze --user verify \
                /usr/lib/systemd/user/sunshine-stream-watchdog.service \
                /usr/lib/systemd/user/sunshine-health.service \
                /usr/lib/systemd/user/sunshine-health.timer
              echo "PASS: helper units verified"
            '

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  vm-boot-test:
    name: Boot the tested digest in a VM
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # bootc-image-builder cannot mount container storage on ubuntu-26.04 runners (runs 36255575262, 36257319278); the action's own CI uses 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ needs.build_push.outputs.digest }}
    env:
      DIGEST: ${{ needs.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Prepare KVM and SSH
        id: prepare-vm
        run: |
          echo "chown=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          sudo timeout 180 apt-get update
          sudo timeout 180 apt-get install -y qemu-system-x86 qemu-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo timeout 30 udevadm control --reload-rules
          sudo timeout 30 udevadm trigger --name-match=kvm
          sudo timeout 30 udevadm settle
          if [[ ! -e /dev/kvm ]]; then
            echo "no /dev/kvm on this runner"
            exit 1
          fi
          ls -l /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
          timeout 30 ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/vm-key"
          cat > "$RUNNER_TEMP/vm-config.toml" <<CONFIG
          [[customizations.user]]
          name = "root"
          key = "$(cat "$RUNNER_TEMP/vm-key.pub")"

          [customizations.kernel]
          append = "console=ttyS0 systemd.wants=sshd.service"
          CONFIG

      - name: Build qcow2 from the tested digest
        id: build-qcow2
        uses: osbuild/bootc-image-builder-action@486ce86198c7d7e123a19dd239525562c4f520d0
        with:
          image: ghcr.io/axel-kaliff/bazzite-sunshine@${{ needs.build_push.outputs.digest }}
          config-file: ${{ runner.temp }}/vm-config.toml
          types: qcow2
          rootfs: btrfs
          additional-args: --use-librepo=True
          chown: ${{ steps.prepare-vm.outputs.chown }}

      - name: Boot and verify deployment
        env:
          QCOW2_PATH: ${{ steps.build-qcow2.outputs.qcow2-output-path }}
        run: |
          timeout 900 qemu-system-x86_64 -enable-kvm -cpu host -m 6G -smp 2 -nographic -snapshot \
            -drive "file=$QCOW2_PATH,if=virtio,format=qcow2" \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 > "$RUNNER_TEMP/serial.log" 2>&1 &
          vm_pid=$!
          trap 'kill "$vm_pid" 2>/dev/null || true; wait "$vm_pid" 2>/dev/null || true' EXIT
          ssh_args=(-i "$RUNNER_TEMP/vm-key" -p 2222 -o BatchMode=yes
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5 -o ConnectionAttempts=1 root@127.0.0.1)
          timeout 600 bash -c 'until timeout 15 ssh "$@" true; do sleep 5; done' _ "${ssh_args[@]}"
          timeout 720 ssh "${ssh_args[@]}" bash -s -- "$DIGEST" <<'GUEST'
          set -euo pipefail
          bootc status --json | jq -e --arg digest "$1" '.status.booted.image.imageDigest == $digest'
          echo 'PASS: booted image digest matches the tested digest'
          state=$(timeout 600 systemctl is-system-running --wait || true)
          echo "system state: $state"
          systemctl --failed --no-legend --plain || true
          systemctl is-active multi-user.target
          echo 'PASS: multi-user.target is active'
          getcap "$(readlink -f /usr/bin/sunshine)" | grep -w cap_sys_admin
          echo 'PASS: Sunshine cap_sys_admin survived deployment'
          for unit in app-dev.lizardbyte.app.Sunshine.service sunshine-stream-watchdog.service sunshine-health.timer; do
            [[ $(systemctl --global is-enabled "$unit") == enabled ]]
            echo "PASS: $unit enabled globally"
          done
          GUEST

      - name: Print serial console on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/serial.log" ]]; then
            cat "$RUNNER_TEMP/serial.log"
          fi

  promote:
    name: Promote the VM-tested digest
    needs: vm-boot-test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      DIGEST: ${{ needs.vm-boot-test.outputs.digest }}
    steps:
      - name: Promote stable tags without rebuilding
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | timeout 60 skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/axel-kaliff/bazzite-sunshine
          for tag in stable "stable-$(date -u +%Y%m%d)"; do
            timeout 360 skopeo copy --preserve-digests "docker://${image}@${DIGEST}" "docker://${image}:${tag}"
          done
